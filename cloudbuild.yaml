# Cloud Build Configuration for SwiftHub
#
# This file defines the CI/CD pipeline for building and deploying SwiftHub.
# Used by Google Cloud Build triggered by GitHub pushes.

steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args: ['build', '-t', 'gcr.io/${PROJECT_ID}/swifthub-api:${SHORT_SHA}', '.']
  
  # 2. Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args: ['push', 'gcr.io/${PROJECT_ID}/swifthub-api:${SHORT_SHA}']
  
  # 3. Tag the image as 'latest'
  - name: 'gcr.io/cloud-builders/docker'
    id: 'tag-latest'
    args: ['tag', 'gcr.io/${PROJECT_ID}/swifthub-api:${SHORT_SHA}', 'gcr.io/${PROJECT_ID}/swifthub-api:latest']
  
  # 4. Push the 'latest' tag
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args: ['push', 'gcr.io/${PROJECT_ID}/swifthub-api:latest']
  
  # 5. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'swifthub-serving-api',
      '--image', 'gcr.io/${PROJECT_ID}/swifthub-api:latest',
      '--region', '${REGION}',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--memory', '512Mi',
      '--cpu', '1',
      '--min-instances', '0',
      '--max-instances', '10',
      '--set-env-vars', 'ENVIRONMENT=${_ENVIRONMENT},BIGQUERY_DATASET=swifthub_warehouse_${_ENVIRONMENT}'
    ]
  
  # 6. Run dbt compile to validate models
  - name: 'python:3.10-slim'
    id: 'dbt-compile'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install dbt-duckdb==1.7.2
        cd dbt_project && dbt compile --vars '{"data_path": "../data/production"}'
  
  # 7. Run pytest to validate contracts
  - name: 'python:3.10-slim'
    id: 'run-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install pytest==8.0.2
        pytest tests/ -v

images:
  - 'gcr.io/${PROJECT_ID}/swifthub-api:${SHORT_SHA}'
  - 'gcr.io/${PROJECT_ID}/swifthub-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
