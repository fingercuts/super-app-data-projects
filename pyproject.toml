[project]
name = "swifthub"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "faker==24.0.0",
    "numpy==1.26.4",
    "pandas==2.2.1",
    "pyarrow==15.0.1",
    "pydantic==2.6.3",
    "dbt-duckdb==1.7.2",
    "fastapi==0.110.0",
    "uvicorn==0.27.1",
    "streamlit==1.31.1",
    "sqlfluff==3.0.0",
    "pytest==8.0.2",
    "plotly==5.18.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.1.6",
    "isort==5.12.0",
    "pre-commit",
]
cloud = [
    "google-cloud-bigquery",
    "google-cloud-storage",
    "google-cloud-run",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["scripts", "api", "dashboard", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["scripts", "api", "dashboard", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-v --tb=short"
