version: '3.8'

services:
  # ==========================================
  # Core Application Services
  # ==========================================
  
  # Data Generator Service (runs sample data generation)
  data-generator:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./scripts:/app/scripts
    environment:
      - DBT_DATABASE_PATH=/app/data/swifthub.duckdb
    command: >
      bash -c "
        python scripts/generate_entities.py &&
        python scripts/generate_transactions.py &&
        python scripts/generate_dirty_data.py &&
        echo 'Data generation complete'
      "
    networks:
      - swifthub-network

  # Streamlit Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./dashboard:/app/dashboard
      - ./data:/app/data
      - ./scripts:/app/scripts
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    command: ["streamlit", "run", "dashboard/SwiftHub_Analytics.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - data-generator
    networks:
      - swifthub-network

  # FastAPI Serving Layer
  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./api:/app/api
      - ./data:/app/data
      - ./scripts:/app/scripts
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - data-generator
    networks:
      - swifthub-network

  # ==========================================
  # Infrastructure Services (Optional)
  # ==========================================

  # Kafka Real-time Streaming Bus
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 200
    ports:
      - "2181:2181"
    networks:
      - swifthub-network

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - swifthub-network

  # -- AIRFLOW ENTERPRISE SETUP --
  # Uncomment the below sections to stand up a local Apache Airflow that runs the generator on a Cron schedule.
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - swifthub-network

  airflow-webserver:
    image: apache/airflow:2.8.1
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./.env:/opt/airflow/.env
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - swifthub-network

  airflow-scheduler:
    image: apache/airflow:2.8.1
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./.env:/opt/airflow/.env
    command: scheduler
    networks:
      - swifthub-network

networks:
  swifthub-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
