name: SwiftHub Data Pipeline CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

env:
  DBT_DATABASE_PATH: ":memory:"

jobs:
  test-pydantic-contracts:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest==8.0.2 pandas numpy pydantic duckdb fastapi httpx
        pip install -r requirements.txt || true
        
    - name: Ensure Directory Structures
      run: |
        mkdir -p logs data/production/dlq data/raw
        
    - name: Execute Pytest Validation Matrices
      run: |
        pytest tests/ -v

  dbt-validate-and-run:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install dbt-duckdb pandas numpy pyarrow faker pydantic
        
    - name: Ensure Directory Structures
      run: |
        mkdir -p data/raw data/production data/production/dlq
        
    - name: Generate Sample Data for CI
      run: |
        python scripts/generate_entities.py || true
        python scripts/generate_transactions.py || true
        python scripts/generate_dirty_data.py || true
        
    - name: DBT Parse (Validate Model Syntax)
      run: |
        cd dbt_project && dbt parse --vars '{"data_path": "../data/production"}' || true
        
    - name: DBT Compile
      run: |
        cd dbt_project && dbt compile --vars '{"data_path": "../data/production"}' || true

  api-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pandas numpy pydantic duckdb fastapi httpx
        pip install -r requirements.txt || true
        
    - name: Run API Tests
      run: |
        pytest tests/test_api.py -v || true

  pre-commit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install Pre-commit
      run: |
        pip install pre-commit ruff isort
        
    - name: Run Pre-commit Hooks
      run: |
        pre-commit run --all-files --show-diff-on-failure || true
