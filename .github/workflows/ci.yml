name: SwiftHub Data Pipeline CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

env:
  DBT_DATABASE_PATH: ":memory:"

jobs:
  test-pydantic-contracts:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest==8.0.2
        
    - name: Ensure Directory Structures
      run: |
        mkdir -p logs data/production/dlq data/raw
        
    - name: Execute Pytest Validation Matrices
      run: |
        pytest tests/ -v

  dbt-validate-and-run:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install Dependencies
      run: |
        pip install dbt-duckdb==1.7.2
        pip install pandas==2.2.1 numpy==1.26.4 pyarrow==15.0.1 faker==24.0.0 pydantic==2.6.3
        
    - name: Ensure Directory Structures
      run: |
        mkdir -p data/raw data/production data/production/dlq
        
    - name: Generate Sample Data for CI
      run: |
        python scripts/generate_entities.py
        python scripts/generate_transactions.py
        python scripts/generate_dirty_data.py
        
    - name: Install DBT
      run: |
        pip install dbt-duckdb==1.7.2
        
    - name: DBT Parse (Validate Model Syntax)
      run: |
        cd dbt_project && dbt parse --vars '{"data_path": "../data/production"}'
        
    - name: DBT Compile
      run: |
        cd dbt_project && dbt compile --vars '{"data_path": "../data/production"}'
        
    - name: DBT Run (Transform Data)
      run: |
        cd dbt_project && dbt run --vars '{"data_path": "../data/production"}'
        
    - name: DBT Test (Data Quality)
      run: |
        cd dbt_project && dbt test --vars '{"data_path": "../data/production"}'
        
    - name: DBT Docs Generate
      run: |
        cd dbt_project && dbt docs generate --vars '{"data_path": "../data/production"}'
        
    - name: Upload DBT Docs Artifact
      uses: actions/upload-artifact@v3
      with:
        name: dbt-docs
        path: dbt_project/target/

  sql-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install SQLFluff
      run: |
        pip install sqlfluff==3.0.0
        
    - name: Lint SQL Models
      run: |
        sqlfluff lint dbt_project/models/ --dialect duckdb

  api-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest==8.0.2
        
    - name: Run API Tests
      run: |
        pytest tests/test_api.py -v

  pre-commit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install Pre-commit
      run: |
        pip install pre-commit ruff isort
        
    - name: Run Pre-commit Hooks
      run: |
        pre-commit run --all-files --show-diff-on-failure
